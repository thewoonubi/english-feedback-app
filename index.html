<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어회화 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F8; --sheet:#FFFFFF; --ink:#16203A; --muted:#5E6A85; --line:#DCE1EA;
  --red:#D2362B; --blue:#2447C9; --hl:rgba(255,222,56,.7); --ruled:#E3E9F5; --wash:rgba(36,71,201,.08);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#10141C; --sheet:#171C27; --ink:#E7EBF3; --muted:#9AA5BD; --line:#283044;
    --red:#FF7468; --blue:#93ABFF; --hl:rgba(255,214,10,.3); --ruled:#212A3C; --wash:rgba(147,171,255,.12);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--sans)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
 
/* layout */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:32px 16px 24px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{margin:0 0 28px 12px;font:600 20px/1.3 var(--sans);letter-spacing:-.01em}
#nav{display:flex;flex-direction:column;gap:2px}
#nav button{display:flex;justify-content:space-between;align-items:baseline;width:100%;text-align:left;padding:9px 12px;border:0;border-left:3px solid transparent;border-radius:0 6px 6px 0;background:none;font-size:15px}
#nav button:hover{background:var(--wash)}
#nav button.on{border-left-color:var(--blue);background:var(--wash);font-weight:600}
#nav .n{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;font-weight:400}
.navsep{height:1px;background:var(--line);margin:12px 12px}
.sidenote{margin:auto 12px 0;padding-top:24px;color:var(--muted);font-size:13px;line-height:1.5}
main{padding:40px clamp(16px,5vw,56px) 96px}
.col{max-width:780px}
 
/* page head */
.ph h2{margin:0;font:600 28px/1.25 var(--sans);letter-spacing:-.02em}
.ph p{margin:6px 0 0;color:var(--muted)}
.ph{margin-bottom:24px}
.searchbar{margin:-8px 0 20px}
.searchbar input{width:100%;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;border-radius:0}
.searchbar input:focus{outline:none;border-bottom:2px solid var(--blue);padding-bottom:9px}
.toolbar{display:flex;gap:12px;align-items:center;margin:20px 0 4px;color:var(--muted);font-size:14px}
 
/* controls */
.btn{display:inline-block;padding:9px 16px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);font-size:15px;font-weight:500;line-height:1.4}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
@media (prefers-color-scheme: dark){.btn.primary{color:#0B1020}}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
@media (prefers-color-scheme: dark){.btn.danger{color:#1A0805}}
.link{background:none;border:0;padding:2px 0;color:var(--muted);font-size:13px}
.link:hover{color:var(--red);text-decoration:underline}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--sheet)}
select{width:auto}
textarea{resize:vertical;line-height:1.5}
.field{margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.two>*{margin:0}
.hint{margin:0 0 12px;color:var(--muted);font-size:14px}
 
/* collapsible form */
details.drop{margin-bottom:8px}
details.drop>summary{list-style:none;cursor:pointer}
details.drop>summary::-webkit-details-marker{display:none}
.drop-body{margin-top:12px;padding:20px;border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
pre.fmt{margin:0 0 12px;padding:12px 14px;border-left:3px solid var(--blue);background:var(--wash);font:13px/1.65 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow:auto}
 
/* date groups */
.day{display:grid;grid-template-columns:132px minmax(0,1fr);gap:8px 24px;padding:26px 0;border-top:1px solid var(--line)}
.day-h{position:sticky;top:24px;align-self:start}
.day-h b{display:block;font:600 18px/1.3 var(--sans)}
.day-h span{color:var(--muted);font-size:13px}
 
/* feedback entry */
.entry+.entry{margin-top:22px;padding-top:22px;border-top:1px dashed var(--line)}
.entry-top{display:flex;justify-content:space-between;align-items:center;min-height:26px}
.cat{display:inline-block;padding:1px 9px;border:1px solid color-mix(in srgb,var(--blue) 45%,transparent);border-radius:4px;color:var(--blue);font-size:13px;font-weight:500}
dl.fields{display:grid;grid-template-columns:5.4em minmax(0,1fr);gap:8px 14px;margin:10px 0 0}
dl.fields dt{padding-top:4px;color:var(--muted);font-size:13px}
dl.fields dd{margin:0}
.wrong{font:400 19px/1.5 var(--serif);color:var(--muted);text-decoration:line-through wavy var(--red);text-decoration-thickness:1.5px;text-underline-offset:3px}
.right{font:600 28px/1.2 var(--hand);color:var(--blue);overflow-wrap:anywhere}
.why{font-size:15px}
.sim{font:400 17px/1.55 var(--serif)}
.plain{font:400 19px/1.5 var(--serif);margin:10px 0 0}
 
/* bars */
.bar-row{display:grid;grid-template-columns:minmax(72px,150px) 1fr 3.4em;align-items:center;gap:14px;padding:9px 0}
.track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.fill{display:block;height:100%;background:var(--blue)}
.fill.hot{background:var(--red)}
.cnt{text-align:right;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.hl{background:linear-gradient(transparent 52%,var(--hl) 52%);padding:0 2px;font-weight:600}
.rep{border-top:1px solid var(--line)}
.rep>summary.bar-row{grid-template-columns:minmax(72px,150px) 1fr 3.4em 14px;list-style:none;cursor:pointer;padding:14px 0}
.rep>summary::-webkit-details-marker{display:none}
.rep>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.rep[open]>summary::after{transform:rotate(45deg)}
.rep-body{padding:2px 0 18px 0}
.pair{padding:8px 0;border-top:1px dashed var(--line)}
.pair:first-child{border-top:0}
.pair .rt{font:600 24px/1.2 var(--hand);color:var(--blue)}
.pair small{display:block;color:var(--muted);font-size:12.5px}
.lead{margin:0 0 18px;font-size:17px}
 
/* stats */
.stats{display:flex;gap:40px;flex-wrap:wrap;margin:4px 0 12px}
.stats b{display:block;font:500 40px/1 var(--serif);font-variant-numeric:lining-nums}
.stats span{color:var(--muted);font-size:14px}
.sect{margin:36px 0 8px;font:600 17px/1.3 var(--sans)}
 
/* notes */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 8px}
.chip{padding:3px 11px;border:1px solid var(--line);border-radius:999px;background:var(--sheet);font-size:13.5px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.note{padding:18px 0;border-top:1px solid var(--line)}
.note .s{font:400 21px/1.45 var(--serif)}
.note .m{margin-top:2px}
.note .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px;color:var(--muted);font-size:13px}
 
/* review */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sheet)}
.seg button{padding:8px 14px;border:0;background:none;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--paper)}
.prog{height:3px;background:var(--line);margin:22px 0 14px;border-radius:2px}
.prog i{display:block;height:100%;background:var(--blue);border-radius:2px}
.flash{position:relative;min-height:320px;padding:44px 36px 36px 72px;border:1px solid var(--line);border-radius:8px;background-color:var(--sheet);background-image:repeating-linear-gradient(transparent 0,transparent 35px,var(--ruled) 35px,var(--ruled) 36px);background-position:0 18px}
.flash::before{content:"";position:absolute;top:0;bottom:0;left:48px;width:1px;background:var(--red);opacity:.45}
.flash .front{font:400 27px/1.4 var(--serif)}
.flash .back{margin-top:22px;font:600 36px/1.2 var(--hand);color:var(--blue)}
.flash .extra{margin-top:8px;color:var(--muted);font-size:14px}
.flash .acts{margin-top:28px}
.cardcount{color:var(--muted);font-size:14px;margin-bottom:14px}
 
/* misc */
.empty{padding:36px 0;color:var(--muted)}
.empty p{margin:0 0 8px}
.empty .btn{margin-top:10px}
.data-sec{padding:22px 0;border-top:1px solid var(--line)}
.data-sec h3{margin:0 0 4px;font:600 17px/1.3 var(--sans)}
.data-sec p{margin:0 0 14px;color:var(--muted);font-size:14.5px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);padding:10px 18px;border-radius:6px;background:var(--ink);color:var(--paper);font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){#toast,.rep>summary::after{transition:none}}
 
/* mobile */
@media (max-width:820px){
  .app{display:block}
  .side{position:sticky;top:0;z-index:5;height:auto;padding:12px 12px 0;border-right:0;border-bottom:1px solid var(--line);background:var(--paper)}
  .brand{margin:0 0 6px 4px;font-size:17px}
  #nav{flex-direction:row;overflow-x:auto;gap:2px;scrollbar-width:none}
  #nav button{width:auto;white-space:nowrap;gap:6px;border-left:0;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;padding:9px 12px}
  #nav button.on{border-bottom-color:var(--blue)}
  .navsep,.sidenote{display:none}
  main{padding:24px 16px 80px}
  .ph h2{font-size:24px}
  .day{grid-template-columns:1fr;gap:12px}
  .day-h{position:static;display:flex;gap:8px;align-items:baseline}
  .two{grid-template-columns:1fr}
  .flash{padding:32px 20px 28px 52px}
  .flash::before{left:34px}
  .flash .front{font-size:23px}
  .bar-row{grid-template-columns:minmax(64px,110px) 1fr 3.2em;gap:10px}
  .rep>summary.bar-row{grid-template-columns:minmax(64px,110px) 1fr 3.2em 12px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h1 class="brand">영어회화 노트</h1>
    <nav id="nav" aria-label="메뉴">
      <button data-t="feedback">날짜별 피드백<span class="n" data-c="feedback"></span></button>
      <button data-t="notes">내 학습 노트<span class="n" data-c="notes"></span></button>
      <button data-t="repeat">반복 교정</button>
      <button data-t="pattern">문장구조·추천</button>
      <div class="navsep"></div>
      <button data-t="week">주간 요약</button>
      <button data-t="review">복습 모드</button>
      <button data-t="data">백업·내보내기</button>
    </nav>
    <p class="sidenote">기록은 이 브라우저에만 저장돼요. 가끔 백업 파일을 받아두세요.</p>
  </aside>
  <main>
    <div class="col">
      <div id="phead"></div>
      <div class="searchbar" id="searchBox"><input id="q" type="search" placeholder="문장, 유형, 뜻으로 검색" aria-label="검색"></div>
      <div id="view"></div>
    </div>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
 
<script>
// Google Drive API 설정
const GOOGLE_CLIENT_ID = '748941383970-aj29m6iuv2g2ss5djt27enibpa4jkvn4.apps.googleusercontent.com';
const GOOGLE_SCOPES = 'https://www.googleapis.com/auth/drive.appdata';
let gapiReady = false, googleAuthInstance = null, googleIsSignedIn = false;
 
const KEY = 'englishFeedbackApp.v1';
let db = load();
let tab = 'feedback', q = '', fDate = '', noteTag = '';
let reviewDeck = [], reviewIdx = 0, reviewShow = false, reviewSrc = 'both';
const formOpen = {fb: false, note: false, json: false, gdrive: false};
 
// 유형별 기본 공부 구조와 추천 표현 (피드백에 PATTERN/TIP이 없을 때 사용)
const PATTERNS = {
  '과거시제': {structure: '주어 + 과거형 동사 (went, saw, met). yesterday, last week 같은 과거 표현과 함께 씀', expr: 'I went to ~ / I met ~ / I got ~'},
  '시제': {structure: '지금 하는 일은 현재, 끝난 일은 과거, 경험은 현재완료로 구분', expr: 'I have been to ~ / I just finished ~'},
  '관사': {structure: '가산명사 단수 앞에는 a/an, 서로 아는 특정한 것은 the', expr: 'I had a meeting / I took the bus'},
  '전치사': {structure: '동사/형용사마다 고정된 전치사를 묶어서 외움 (depend on, interested in)', expr: "I'm interested in ~ / It depends on ~"},
  '주어-동사 일치': {structure: '3인칭 단수(he/she/it) 현재형에는 동사에 -s/-es', expr: "She works here / He doesn't like it"},
  '복수형': {structure: '셀 수 있는 명사의 복수형 확인 (many + 복수명사)', expr: 'many friends / a few days'},
  '부정문·조동사': {structure: 'do/does/did + not + 동사원형', expr: "I don't know. / I didn't go."},
  '어순': {structure: '주어 + 동사 + 목적어. 빈도부사는 be동사 뒤, 일반동사 앞', expr: 'I always ~ / I am always ~'},
  '어휘 선택': {structure: '비슷한 뜻 단어의 뉘앙스 차이 확인', expr: 'Could you ~? (정중한 부탁)'}
};
 
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY)) || {};
    const data = {feedback: d.feedback || [], notes: d.notes || []};
    data.notes.forEach(n => n.tags = n.tags || []);
    return data;
  } catch (e) { return {feedback: [], notes: []}; }
}
let lastDriveSave = 0;
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(db));
    // 자동 Google Drive 동기화 (1분 간격으로)
    if (googleIsSignedIn && gapiReady) {
      const now = Date.now();
      if (now - lastDriveSave > 60000) {
        lastDriveSave = now;
        autoSaveToDrive();
      }
    }
  } catch (e) { toast('저장하지 못했어요. 브라우저 저장 공간을 확인해주세요.'); }
}
// Google Drive API 함수들
function initGoogleAPI() {
  const script = document.createElement('script');
  script.src = 'https://apis.google.com/js/api.js';
  script.async = true; script.defer = true;
  script.onload = () => {
    window.gapi.load('client:auth2', () => {
      window.gapi.client.init({
        clientId: GOOGLE_CLIENT_ID,
        discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
        scope: GOOGLE_SCOPES
      }).then(() => {
        googleAuthInstance = window.gapi.auth2.getAuthInstance();
        googleIsSignedIn = googleAuthInstance.isSignedIn.get();
        gapiReady = true;
        googleAuthInstance.isSignedIn.listen(updateGoogleAuthStatus);
        render();
        toast('구글 드라이브 연결 준비가 완료됐어요! 로그인 버튼을 클릭하세요.');
      }).catch(err => {
        console.error('Google API 초기화 실패:', err);
        toast('구글 API 초기화 실패. 잠시 후 다시 시도해주세요.');
      });
    });
  };
  document.head.appendChild(script);
}
 
function updateGoogleAuthStatus(isSignedIn) {
  googleIsSignedIn = isSignedIn;
  render();
}
 
function handleSignIn() {
  if (!gapiReady) { toast('구글 API가 아직 준비 중이에요.'); return; }
  googleAuthInstance.signIn().then(() => {
    toast('구글 계정으로 로그인했어요! 🔐');
    autoSaveToDrive();
  }).catch(err => toast('로그인 실패'));
}
 
function handleSignOut() {
  googleAuthInstance.signOut().then(() => {
    toast('로그아웃했어요.');
    render();
  });
}
 
function autoSaveToDrive() {
  if (!googleIsSignedIn || !gapiReady) return;
  const fileName = `english-feedback-${today()}.json`;
  const fileContent = JSON.stringify(db, null, 2);
  const fileBlob = new Blob([fileContent], {type: 'application/json'});
 
  window.gapi.client.drive.files.list({
    q: `name='${fileName}' and trashed=false`,
    spaces: 'appDataFolder',
    pageSize: 1,
    fields: 'files(id, name)'
  }).then(res => {
    if (res.result.files && res.result.files.length > 0) {
      const fileId = res.result.files[0].id;
      window.gapi.client.drive.files.update({
        fileId: fileId,
        resource: {name: fileName, mimeType: 'application/json'},
        media: {mimeType: 'application/json', body: fileBlob},
        fields: 'id'
      }).then(() => {
        console.log('구글 드라이브 자동 저장 완료');
      }).catch(err => console.error('업데이트 오류:', err));
    } else {
      window.gapi.client.drive.files.create({
        resource: {
          name: fileName,
          mimeType: 'application/json',
          parents: ['appDataFolder']
        },
        media: {mimeType: 'application/json', body: fileBlob},
        fields: 'id'
      }).then(() => {
        console.log('구글 드라이브 파일 생성 완료');
      }).catch(err => console.error('생성 오류:', err));
    }
  }).catch(err => {
    console.error('Drive 저장 오류:', err);
  });
}
 
function loadFromDrive() {
  if (!googleIsSignedIn || !gapiReady) { toast('먼저 구글 계정으로 로그인해주세요.'); return; }
  const fileName = `english-feedback-${today()}.json`;
 
  window.gapi.client.drive.files.list({
    q: `name='${fileName}' and trashed=false`,
    spaces: 'appDataFolder',
    pageSize: 1,
    fields: 'files(id, name)'
  }).then(res => {
    if (!res.result.files || res.result.files.length === 0) {
      toast('구글 드라이브에 오늘의 백업이 없어요.');
      return;
    }
 
    const fileId = res.result.files[0].id;
    window.gapi.client.drive.files.get({fileId, alt: 'media'}).then(res => {
      const d = res.result;
      if (d && d.feedback && d.notes && Array.isArray(d.feedback) && Array.isArray(d.notes)) {
        db = d;
        db.notes.forEach(n => n.tags = n.tags || []);
        save();
        render();
        toast('구글 드라이브에서 복원했어요! ☁️');
      } else {
        toast('파일 형식이 올바르지 않아요.');
      }
    }).catch(err => {
      toast('로드 실패');
      console.error(err);
    });
  }).catch(err => {
    toast('파일 목록 조회 실패');
    console.error(err);
  });
}
 
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const today = (offset = 0) => new Date(Date.now() - offset * 86400000).toLocaleDateString('sv-SE');
const matches = text => !q || text.toLowerCase().includes(q.toLowerCase());
const allDates = () => [...new Set(db.feedback.map(f => f.date))].sort().reverse();
function fmtDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return {md: `${m}월 ${d}일`, wd: ['일', '월', '화', '수', '목', '금', '토'][dt.getDay()] + '요일', y: String(y)};
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
let curHead = '';
const head = (title, desc) => { curHead = `<header class="ph"><h2>${title}</h2><p>${desc}</p></header>`; return ''; };
 
function go(t) { tab = t; window.scrollTo(0, 0); render(); }
 
function render() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  document.querySelector('[data-c="feedback"]').textContent = db.feedback.length || '';
  document.querySelector('[data-c="notes"]').textContent = db.notes.length || '';
  const views = {feedback: vFeedback, notes: vNotes, repeat: vRepeat, pattern: vPattern, week: vWeek, review: vReview, data: vData};
  curHead = '';
  const body = views[tab]();
  document.getElementById('phead').innerHTML = curHead;
  document.getElementById('view').innerHTML = body;
  document.getElementById('searchBox').style.display = ['feedback', 'notes', 'repeat', 'pattern'].includes(tab) ? 'block' : 'none';
}
 
/* ---------- 1. 날짜별 피드백 ---------- */
const FIELD = {DATE: 'date', MISTAKE: 'mistake', WHY: 'why', CORRECT: 'correct', SIMILAR: 'similar', CATEGORY: 'category', PATTERN: 'pattern', TIP: 'tip'};
 
function parseFeedback(text) {
  const out = [];
  text.split(/(?=^\s*\[DATE\])/mi).filter(c => c.trim()).forEach(chunk => {
    const f = {id: uid(), date: '', mistake: '', why: '', correct: '', similar: '', category: '', pattern: '', tip: '', created: Date.now()};
    let field = null;
    chunk.split('\n').forEach(line => {
      const m = line.match(/^\s*\[(\w+)\]\s*(.*)$/);
      if (m && FIELD[m[1].toUpperCase()]) {
        field = FIELD[m[1].toUpperCase()];
        f[field] = m[2].trim();
      } else if (field && line.trim()) {
        f[field] = (f[field] + ' ' + line.trim()).trim();
      }
    });
    if (!/^\d{4}-\d{2}-\d{2}$/.test(f.date)) f.date = today();
    if (f.mistake || f.correct) out.push(f);
  });
  return out;
}
function importFeedback() {
  const items = parseFeedback(document.getElementById('imp').value);
  if (!items.length) { toast('인식된 항목이 없어요. [DATE]부터 시작하는 형식인지 확인해주세요.'); return; }
  db.feedback.push(...items); save(); formOpen.fb = false; render();
  toast(items.length + '개 저장했어요.');
}
function delFeedback(id) {
  if (!confirm('이 피드백을 삭제할까요?')) return;
  db.feedback = db.feedback.filter(f => f.id !== id); save(); render();
}

    mk(0, 'I have meeting at 3.', '셀 수 있는 단수 명사 앞에는 a/an이 필요해요.', 'I have a meeting at 3.', 'I had a headache this morning.', '관사'),
    mk(1, 'We eat dinner together last night.', '지난 일을 말할 때는 동사를 과거형으로 바꿔요.', 'We ate dinner together last night.', 'She called me two days ago.', '과거시제'),
    mk(3, 'I watch a movie last Sunday.', 'last Sunday는 과거를 나타내요.', 'I watched a movie last Sunday.', 'They visited Busan last month.', '과거시제')

function entryHTML(f) {
  return `<article class="entry">
    <div class="entry-top">${f.category ? `<span class="cat">${esc(f.category)}</span>` : '<span></span>'}
      <button class="link" onclick="delFeedback('${f.id}')" aria-label="이 피드백 삭제">삭제</button></div>
    <dl class="fields">
      <dt>틀린 부분</dt><dd><span class="wrong">${esc(f.mistake) || '-'}</span></dd>
      <dt>틀린 이유</dt><dd class="why">${esc(f.why) || '-'}</dd>
      <dt>올바른 표현</dt><dd><span class="right">${esc(f.correct) || '-'}</span></dd>
      <dt>비슷한 예문</dt><dd class="sim">${esc(f.similar) || '-'}</dd>
    </dl></article>`;
}
 
function dayGroup(d, inner) {
  const t = fmtDate(d);
  return `<section class="day"><div class="day-h"><b>${t.md}</b><span>${t.wd} ${t.y}</span></div><div>${inner}</div></section>`;
}
 
function importJSONText() {
  const jsonText = document.getElementById('jsonText').value.trim();
  if (!jsonText) { toast('JSON을 입력해주세요.'); return; }
  try {
    const d = JSON.parse(jsonText);
    if (!Array.isArray(d.feedback) || !Array.isArray(d.notes)) throw new Error('feedback과 notes 배열이 필요합니다.');
    db = d; db.notes.forEach(n => n.tags = n.tags || []); save(); render();
    document.getElementById('jsonText').value = '';
    toast('JSON을 로드했어요.');
  } catch (e) {
    toast('올바른 JSON 형식이 아니에요: ' + e.message);
  }
}

[MISTAKE] I go to school yesterday.
[WHY] yesterday가 있으면 과거형을 써야 해요.
[CORRECT] I went to school yesterday.
[SIMILAR] I met my friend last week.
[CATEGORY] 과거시제
[PATTERN] (선택) 주어 + 과거형 동사

      <textarea id="imp" rows="8" placeholder="여기에 붙여넣기" aria-label="붙여넣을 피드백"></textarea>
      <div style="margin-top:10px"><button class="btn primary" onclick="importFeedback()">저장</button></div>
    </div></details>`;
 
  if (!db.feedback.length) {
    return h + `<div class="empty"><p>아직 저장된 피드백이 없어요.</p>
      <p>위 버튼으로 첫 피드백을 붙여넣거나, 화면이 어떻게 보이는지 예시로 먼저 확인해보세요.</p>

}
 
/* ---------- 2. 내 학습 노트 (직접 입력) ---------- */
function addNote() {
  const sentence = document.getElementById('nSen').value.trim();
  if (!sentence) { toast('영어 문장을 입력해주세요.'); return; }
  const tags = document.getElementById('nTags').value.split(',').map(t => t.trim()).filter(Boolean);
  db.notes.push({
    id: uid(), date: document.getElementById('nDate').value || today(),
    source: document.getElementById('nSrc').value.trim(), sentence,
    meaning: document.getElementById('nMean').value.trim(), tags, created: Date.now()
  });
  save(); formOpen.note = false; render(); toast('문장을 저장했어요.');
}
function delNote(id) {
  if (!confirm('이 문장을 삭제할까요?')) return;
  db.notes = db.notes.filter(n => n.id !== id); save(); render();
}
function setNoteTag(el) { noteTag = el.dataset.t; render(); }
 
function vNotes() {
  const tags = [...new Set(db.notes.flatMap(n => n.tags))].sort();
  let h = head('내 학습 노트', '직접 공부한 문장과 표현을 모아두는 곳이에요.');

      <div class="field"><textarea id="nSen" rows="2" placeholder="영어 문장" aria-label="영어 문장"></textarea></div>

      <button class="btn primary" onclick="addNote()">저장</button>

  if (!db.notes.length) return h + '<div class="empty"><p>아직 저장된 문장이 없어요.</p><p>위 버튼으로 오늘 공부한 문장을 추가해보세요.</p></div>';
 
  if (tags.length) h += `<div class="chips" role="group" aria-label="태그 필터">
    <button class="chip ${noteTag === '' ? 'on' : ''}" data-t="" onclick="setNoteTag(this)">전체</button>
    ${tags.map(t => `<button class="chip ${noteTag === t ? 'on' : ''}" data-t="${esc(t)}" onclick="setNoteTag(this)">${esc(t)}</button>`).join('')}</div>`;
 
  const list = db.notes.filter(n => (!noteTag || n.tags.includes(noteTag)) &&
    matches([n.sentence, n.meaning, n.source, n.tags.join(' ')].join(' ')))
    .sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);
  if (!list.length) return h + '<div class="empty"><p>조건에 맞는 문장이 없어요.</p></div>';
  h += '<div style="margin-top:12px">';
  list.forEach(n => {
    h += `<article class="note"><div class="s">${esc(n.sentence)}</div>
      ${n.meaning ? `<div class="m">${esc(n.meaning)}</div>` : ''}

        <button class="link" onclick="delNote('${n.id}')" aria-label="이 문장 삭제">삭제</button></div></article>`;
  });
  return h + '</div>';
}
 
/* ---------- 3. 반복 교정 ---------- */
function barsHTML(entries) {
  const max = Math.max(...entries.map(e => e[1]), 1);
  return entries.map(([k, n]) => `<div class="bar-row"><span><span class="${n >= 3 ? 'hl' : ''}">${esc(k)}</span></span>
    <span class="track"><span class="fill ${n >= 3 ? 'hot' : ''}" style="width:${n / max * 100}%"></span></span>
    <span class="cnt">${n}회</span></div>`).join('');
}
function vRepeat() {
  let h = head('반복 교정', '같은 유형으로 여러 번 교정받은 항목이에요. 3회 이상이면 표시돼요.');
  const groups = {};
  db.feedback.filter(f => matches([f.mistake, f.correct, f.category].join(' ')))
    .forEach(f => (groups[f.category || '미분류'] ??= []).push(f));
  const arr = Object.entries(groups).sort((a, b) => b[1].length - a[1].length);
  if (!arr.length) return h + `<div class="empty"><p>${db.feedback.length ? '검색어에 맞는 교정이 없어요.' : '아직 교정 기록이 없어요.'}</p>
    <p>피드백을 저장하면 같은 유형끼리 자동으로 모여요.</p></div>`;
 
  h += `<p class="lead">가장 자주 교정받은 유형은 <span class="hl">${esc(arr[0][0])}</span> (${arr[0][1].length}회)예요.</p>`;
  arr.forEach(([k, items]) => {
    const max = arr[0][1].length, n = items.length, hot = n >= 3;
    h += `<details class="rep" ${hot ? 'open' : ''}><summary class="bar-row">
      <span><span class="${hot ? 'hl' : ''}">${esc(k)}</span></span>
      <span class="track"><span class="fill ${hot ? 'hot' : ''}" style="width:${n / max * 100}%"></span></span>
      <span class="cnt">${n}회</span></summary>
      <div class="rep-body">${items.slice().sort((a, b) => b.date.localeCompare(a.date)).map(f =>
        `<div class="pair"><span class="wrong">${esc(f.mistake)}</span><br><span class="rt">${esc(f.correct)}</span><small>${esc(f.date)}</small></div>`).join('')}</div></details>`;
  });
  return h;
}
 
/* ---------- 4. 날짜별 문장구조 · 추천 표현 ---------- */
function vPattern() {
  let h = head('문장구조·추천 표현', '그날 교정받은 내용을 바탕으로 복습할 구조와 표현이에요.');
  let any = false;
  allDates().forEach(d => {
    const items = db.feedback.filter(f => f.date === d &&
      matches([f.mistake, f.correct, f.category, f.pattern, f.tip].join(' ')));
    if (!items.length) return;
    any = true;
    h += dayGroup(d, items.map(f => {
      const cat = f.category || '기타';
      const def = PATTERNS[cat] || {structure: '', expr: ''};
      return `<article class="entry"><div class="entry-top"><span class="cat">${esc(cat)}</span></div>
        <p class="plain">${esc(f.correct)}</p>
        <dl class="fields"><dt>공부할 구조</dt><dd>${esc(f.pattern || def.structure) || '-'}</dd>
        <dt>추천 표현</dt><dd class="sim">${esc(f.tip || def.expr) || '-'}</dd></dl></article>`;
    }).join(''));
  });
  return any ? h : h + `<div class="empty"><p>${db.feedback.length ? '검색어에 맞는 항목이 없어요.' : '아직 정리할 내용이 없어요.'}</p>
    <p>피드백을 저장하면 날짜별 공부 포인트가 여기에 정리돼요.</p></div>`;
}
 
/* ---------- 5. 주간 요약 ---------- */
function vWeek() {
  const thisWeek = new Set([0, 1, 2, 3, 4, 5, 6].map(i => today(i)));
  const lastWeek = new Set([7, 8, 9, 10, 11, 12, 13].map(i => today(i)));
  const cur = db.feedback.filter(f => thisWeek.has(f.date));
  const prev = db.feedback.filter(f => lastWeek.has(f.date));
  const curNotes = db.notes.filter(n => thisWeek.has(n.date)).length;
  const counts = {};
  cur.forEach(f => { const k = f.category || '미분류'; counts[k] = (counts[k] || 0) + 1; });
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const days = new Set(cur.map(f => f.date)).size;
  const trend = !prev.length && !cur.length ? ''
    : cur.length < prev.length ? `지난 7일(${prev.length}개)보다 ${prev.length - cur.length}개 줄었어요.`
    : cur.length > prev.length ? `지난 7일(${prev.length}개)보다 ${cur.length - prev.length}개 늘었어요. 자주 틀린 유형을 먼저 복습해보세요.`
    : `지난 7일과 같은 ${cur.length}개예요.`;
 
  let h = head('주간 요약', '최근 7일 동안의 기록이에요.');
  h += `<div class="stats"><div><b>${days}</b><span>대화한 날</span></div>
    <div><b>${cur.length}</b><span>교정받은 문장</span></div>
    <div><b>${curNotes}</b><span>새로 적은 문장</span></div></div>`;
  if (trend) h += `<p class="lead" style="margin-top:16px">${trend}</p>`;
  h += '<h3 class="sect">많이 틀린 유형</h3>';
  h += top.length ? barsHTML(top) : '<p class="empty" style="padding:8px 0">이번 주 교정 기록이 없어요.</p>';
  h += '<h3 class="sect">이번 주 교정 목록</h3>';
  h += cur.length ? cur.slice().sort((a, b) => b.date.localeCompare(a.date)).map(f =>
    `<div class="pair"><span class="wrong">${esc(f.mistake)}</span><br><span class="rt">${esc(f.correct)}</span><small>${esc(f.date)}</small></div>`).join('')
    : '<p class="empty" style="padding:8px 0">없음</p>';
  return h;
}
 
/* ---------- 6. 복습 모드 (플래시카드) ---------- */
function startReview(src) {
  if (src) reviewSrc = src;
  const deck = [];
  if (reviewSrc !== 'feedback') db.notes.forEach(n => deck.push({
    front: n.meaning || '이 문장을 영어로 말해보세요', back: n.sentence, extra: [n.source, n.tags.join(', ')].filter(Boolean).join(' · ')
  }));
  if (reviewSrc !== 'notes') db.feedback.forEach(f => deck.push({front: f.mistake, back: f.correct, extra: f.why}));
  if (!deck.length) { reviewDeck = []; render(); toast('복습할 항목이 없어요. 먼저 피드백이나 문장을 저장해주세요.'); return; }
  deck.sort(() => Math.random() - 0.5);
  reviewDeck = deck; reviewIdx = 0; reviewShow = false; render();
}
function showCard() { reviewShow = true; render(); }
function nextCard() { reviewIdx++; reviewShow = false; render(); }
document.addEventListener('keydown', e => {
  if (tab !== 'review' || !reviewDeck.length || reviewIdx >= reviewDeck.length) return;
  if (['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON'].includes(e.target.tagName)) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); reviewShow ? nextCard() : showCard(); }
});
 
function vReview() {
  const seg = `<div class="seg" role="group" aria-label="복습 대상">
    ${[['both', '전체'], ['notes', '내 학습 노트'], ['feedback', '교정받은 문장']].map(([v, l]) =>
      `<button class="${reviewSrc === v ? 'on' : ''}" onclick="startReview('${v}')">${l}</button>`).join('')}</div>`;
  let h = head('복습 모드', '틀렸던 문장이나 뜻을 보고 먼저 영어로 말해본 뒤, 정답을 확인하세요.') + seg;
  if (!reviewDeck.length) return h + `<div class="empty"><p>복습할 대상을 고르면 카드가 섞여서 나와요.</p>
    <button class="btn primary" onclick="startReview()">복습 시작</button></div>`;
  if (reviewIdx >= reviewDeck.length) return h + `<div class="empty"><p>카드 ${reviewDeck.length}장을 모두 봤어요.</p>
    <button class="btn primary" onclick="startReview()">다시 섞어서 시작</button></div>`;
  const c = reviewDeck[reviewIdx];
  return h + `<div class="prog"><i style="width:${reviewIdx / reviewDeck.length * 100}%"></i></div>
    <div class="cardcount">${reviewIdx + 1} / ${reviewDeck.length}</div>
    <div class="flash">
      <div class="front">${esc(c.front)}</div>
      ${reviewShow ? `<div class="back">${esc(c.back)}</div>${c.extra ? `<div class="extra">${esc(c.extra)}</div>` : ''}` : ''}
      <div class="acts">${reviewShow
        ? '<button class="btn primary" onclick="nextCard()">다음 카드</button>'
        : '<button class="btn primary" onclick="showCard()">정답 보기</button>'}
        <span class="extra" style="margin-left:10px">스페이스바로도 넘길 수 있어요</span></div>
    </div>`;
}
 
/* ---------- 7. 백업 · 내보내기 ---------- */
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click();
}
function exportJSON() { download(`english-feedback-${today()}.json`, JSON.stringify(db, null, 2), 'application/json'); }
function importJSON(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.feedback) || !Array.isArray(d.notes)) throw new Error();
      db = d; db.notes.forEach(n => n.tags = n.tags || []); save();
      render(); toast('백업에서 복원했어요.');
    } catch (e) { toast('올바른 백업 파일이 아니에요. 이 앱에서 받은 JSON 파일을 선택해주세요.'); }
  };
  r.readAsText(file);
}
function exportMD() {
  let md = '# 영어회화 노트\n\n## 날짜별 피드백\n\n';
  allDates().forEach(d => {
    md += `### ${d}\n\n`;
    db.feedback.filter(f => f.date === d).forEach(f => {
      md += `- 틀린 부분: ${f.mistake}\n  - 틀린 이유: ${f.why || '-'}\n  - 올바른 표현: ${f.correct}\n  - 비슷한 예문: ${f.similar || '-'}\n  - 유형: ${f.category || '-'}\n`;
    });
    md += '\n';
  });
  md += '## 내 학습 노트\n\n';
  [...db.notes].sort((a, b) => b.date.localeCompare(a.date)).forEach(n => {
    md += `- ${n.sentence}${n.meaning ? ' — ' + n.meaning : ''}${n.tags.length ? ' (태그: ' + n.tags.join(', ') + ')' : ''}\n`;
  });
  download(`english-notes-${today()}.md`, md, 'text/markdown');
}
function clearAll() {
  if (!confirm('모든 기록을 삭제할까요? 되돌릴 수 없어요. 먼저 백업을 받아두세요.')) return;
  db = {feedback: [], notes: []}; save(); render(); toast('모든 기록을 삭제했어요.');
}
function vData() {
  let h = head('백업·내보내기', '기록은 이 브라우저에만 저장돼요. 브라우저 데이터를 지우기 전에 백업하세요.');
 
  h += `<section class="data-sec"><h3>☁️ 구글 드라이브 동기화</h3>
    <p>모든 기록을 구글 드라이브에 자동으로 백업하고, 다른 기기에서 동기화해요.</p>
    <div class="acts">`;
 
  if (!gapiReady) {
    h += `<button class="btn primary" onclick="initGoogleAPI()">구글 드라이브 연결하기</button></div></section>`;
  } else if (!googleIsSignedIn) {
    h += `<button class="btn primary" onclick="handleSignIn()">구글 계정으로 로그인</button></div></section>`;
  } else {
    h += `<button class="btn primary" onclick="autoSaveToDrive()">지금 저장하기</button>
    <button class="btn" onclick="loadFromDrive()">복원하기</button>
    <button class="btn" onclick="handleSignOut()">로그아웃</button></div>
    <p style="color:var(--muted);font-size:14px;margin-top:8px">✅ 구글 계정으로 연결됐어요. 변경사항이 자동으로 동기화됩니다.</p></section>`;
  }
 
  h += `<section class="data-sec"><h3>백업과 복원</h3><p>모든 피드백과 학습 노트를 JSON 파일로 저장하거나, 저장해둔 파일에서 되돌려요.</p>
    <div class="acts"><button class="btn primary" onclick="exportJSON()">백업 파일 받기</button>
    <label class="btn" tabindex="0" onkeydown="if(event.key==='Enter')this.querySelector('input').click()">백업에서 복원<input type="file" accept=".json" onchange="importJSON(this.files[0])" style="display:none"></label></div></section>
  <section class="data-sec"><h3>Markdown으로 내보내기</h3><p>Notion이나 문서 앱에 붙여넣기 좋은 텍스트 파일이에요.</p>
    <button class="btn" onclick="exportMD()">Markdown 받기</button></section>
  <section class="data-sec"><h3>모든 기록 삭제</h3><p>피드백과 학습 노트가 모두 지워져요.</p>
    <button class="btn danger" onclick="clearAll()">모든 기록 삭제</button></section>`;
 
  return h;
}
 
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-t]'); if (b) go(b.dataset.t);
});
document.getElementById('q').addEventListener('input', e => { q = e.target.value; render(); });
render();
